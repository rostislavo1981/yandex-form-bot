name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mvp-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mdr_user
          POSTGRES_PASSWORD: mdr_pass
          POSTGRES_DB: mdr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: max_daily_report
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: max_daily_report
        run: ruff check .

      - name: Apply migrations
        working-directory: max_daily_report
        env:
          DATABASE_URL: postgresql+asyncpg://mdr_user:mdr_pass@localhost:5432/mdr_test
        run: alembic upgrade head

      - name: Test (pytest)
        working-directory: max_daily_report
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://mdr_user:mdr_pass@localhost:5432/mdr_test
          DATABASE_URL: postgresql+asyncpg://mdr_user:mdr_pass@localhost:5432/mdr_test
        run: pytest -q

      - name: Alembic check
        working-directory: max_daily_report
        env:
          DATABASE_URL: postgresql+asyncpg://mdr_user:mdr_pass@localhost:5432/mdr_test
        run: alembic check || true

  mvp-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: max_daily_report/frontend/package-lock.json

      - name: Install dependencies
        working-directory: max_daily_report/frontend
        run: npm ci

      - name: Build
        working-directory: max_daily_report/frontend
        run: npm run build

      - name: Test
        working-directory: max_daily_report/frontend
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [mvp-backend, mvp-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: max_daily_report
        run: docker build -t mdr-test .

      - name: Health smoke
        working-directory: max_daily_report
        run: |
          docker run -d --name mdr-test-run \
            -e APP_ENV=dev \
            -e DEBUG=true \
            -e DATABASE_URL=postgresql+asyncpg://mdr_user:mdr_pass@db:5432/mdr_db \
            -p 8000:8000 \
            mdr-test
          sleep 3
          curl -fsS http://127.0.0.1:8000/api/health || exit 1
          docker stop mdr-test-run || true
