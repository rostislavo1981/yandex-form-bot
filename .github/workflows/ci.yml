name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  smoke:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install + import-check
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "from backend.app import create_app; from backend.config import get_settings; assert create_app()"
      - name: Healthz
        run: |
          python -m uvicorn backend.app:create_app --factory --host 127.0.0.1 --port 8765 &
          sleep 3
          curl -fsS http://127.0.0.1:8765/healthz
          pkill -f "uvicorn backend.app" || true
