services:
  bot:
    build:
      context: .
      args:
        # Set to 1 to include Chromium (~300MB) for filling real Yandex Forms
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-0}
    image: yandex-form-bot:latest
    container_name: yfb-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bot runs the polling loop; if you also want the API for debugging,
      # add a second service `api` (see README).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_CONFIG: "1"   # prod: require all secrets
      TZ: Europe/Moscow
    volumes:
      - bot-data:/app/data
    command: ["bot"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz", "||", "exit", "0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Reminder service: runs yfb-reminder in a loop, sleeping until 20:00 each day.
  # No system cron needed — the container itself is the scheduler.
  # Set REMINDER_HOUR / REMINDER_MINUTE in .env to override 20:00.
  reminder:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-0}
    image: yandex-form-bot:latest
    container_name: yfb-reminder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_CONFIG: "1"
      TZ: Europe/Moscow
    volumes:
      - bot-data:/app/data
    command: ["python", "-m", "backend.cli.scheduler"]
    depends_on:
      - bot

  api:  # optional: enable for /healthz, debugging
    build: .
    image: yandex-form-bot:latest
    container_name: yfb-api
    profiles: ["api"]  # start with: docker compose --profile api up
    command: ["api"]
    env_file:
      - .env
    environment:
      STRICT_CONFIG: "1"
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
    name: yfb-bot-data
