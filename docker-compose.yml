services:
  # Reminder service: runs yfb-reminder in a loop, sleeping until 20:00 each day.
  # No system cron needed — the container itself is the scheduler.
  # Set REMINDER_HOUR / REMINDER_MINUTE in .env to override 20:00.
  # STRICT_CONFIG=0: this service only needs MAX_BOT_TOKEN + FORM_PUBLISHED_URL.
  # YandexGPT / Yandex Disk are required only for the optional `bot` service below.
  reminder:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-0}
    image: yandex-form-bot:latest
    container_name: yfb-reminder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_CONFIG: "0"
      TZ: Europe/Moscow
    volumes:
      - bot-data:/app/data
    command: ["scheduler"]

  # Optional main bot: needs YANDEX_GPT_* and YANDEX_DISK_OAUTH_TOKEN to parse reports.
  # Enable with: docker compose --profile full up -d
  # Disabled by default — only the reminder service runs.
  bot:
    profiles: ["full"]  # start with: docker compose --profile full up
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-0}
    image: yandex-form-bot:latest
    container_name: yfb-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_CONFIG: "1"
      TZ: Europe/Moscow
    volumes:
      - bot-data:/app/data
    command: ["bot"]
    depends_on:
      - reminder

  api:  # optional: enable for /healthz, debugging
    profiles: ["api", "full"]
    build: .
    image: yandex-form-bot:latest
    container_name: yfb-api
    command: ["api"]
    env_file:
      - .env
    environment:
      STRICT_CONFIG: "1"
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
    name: yfb-bot-data
