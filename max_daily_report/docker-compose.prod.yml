services:
  db:
    image: postgres:16-alpine
    container_name: mdr-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mdr_db}
    volumes:
      - mdr_postgres_data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdr_user} -d ${POSTGRES_DB:-mdr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mdr

  api:
    build:
      context: .
      target: base
    container_name: mdr-api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdr_user}:${POSTGRES_PASSWORD:-mdr_pass}@db:5432/${POSTGRES_DB:-mdr_db}
      APP_ENV: production
      DEBUG: "false"
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  migrations:
    build:
      context: .
      target: base
    container_name: mdr-migrations
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdr_user}:${POSTGRES_PASSWORD:-mdr_pass}@db:5432/${POSTGRES_DB:-mdr_db}
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mdr

  scheduler:
    build:
      context: .
      target: base
    container_name: mdr-scheduler
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdr_user}:${POSTGRES_PASSWORD:-mdr_pass}@db:5432/${POSTGRES_DB:-mdr_db}
      APP_ENV: production
      DEBUG: "false"
      SCHEDULER_API_URL: http://api:8000
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Moscow}
    command: ["python", "-m", "app.scheduler_runner"]
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      target: base
    container_name: mdr-worker
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mdr_user}:${POSTGRES_PASSWORD:-mdr_pass}@db:5432/${POSTGRES_DB:-mdr_db}
      APP_ENV: production
      DEBUG: "false"
      WORKER_API_URL: http://api:8000
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    command: ["python", "-m", "app.worker_runner"]
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    image: postgres:16-alpine
    container_name: mdr-backup
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.20
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-mdr_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mdr_pass}
      PGDATABASE: ${POSTGRES_DB:-mdr_db}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    command:
      - sh
      - -c
      - >-
        while true; do
          pg_dump -Fc -f "/backups/mdr_$$(date +%Y-%m-%d_%H-%M-%S).dump" &&
          find /backups -type f -name 'mdr_*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete;
          sleep "$${BACKUP_INTERVAL_SECONDS}";
        done
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: mdr-caddy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
    networks:
      - mdr

volumes:
  mdr_postgres_data:
    name: mdr-postgres-data
  caddy_data:
    name: mdr-caddy-data
  caddy_config:
    name: mdr-caddy-config

networks:
  mdr:
    name: mdr
