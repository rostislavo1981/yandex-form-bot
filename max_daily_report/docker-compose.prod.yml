services:
  db:
    image: postgres:16-alpine
    container_name: mdr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mdr_db}
    volumes:
      - mdr_postgres_data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdr_user} -d ${POSTGRES_DB:-mdr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mdr

  api:
    build: .
    container_name: mdr-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mdr_user:mdr_pass@db:5432/mdr_db}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  scheduler:
    build: .
    container_name: mdr-scheduler
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mdr_user:mdr_pass@db:5432/mdr_db}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SCHEDULER_API_URL: http://api:8000
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Moscow}
    command: ["python", "-m", "app.scheduler_runner"]
    networks:
      - mdr
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep app.scheduler_runner || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: mdr-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
    networks:
      - mdr

volumes:
  mdr_postgres_data:
    name: mdr-postgres-data
  caddy_data:
    name: mdr-caddy-data
  caddy_config:
    name: mdr-caddy-config

networks:
  mdr:
    name: mdr
