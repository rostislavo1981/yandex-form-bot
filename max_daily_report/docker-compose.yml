services:
  db:
    image: postgres:16-alpine
    container_name: mdr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mdr_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mdr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdr_user} -d ${POSTGRES_DB:-mdr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mdr-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mdr_user:mdr_pass@db:5432/mdr_db}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mdr_postgres_data:
    name: mdr-postgres-data
